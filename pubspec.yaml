name: hospital_ai
description: "Hospital AI — 30-day post-operative recovery programme, patient app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  dio: ^5.10.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  drift: ^2.34.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  flutter_secure_storage: ^10.3.1
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1
  connectivity_plus: ^7.3.1
  uuid: ^4.6.0
  intl: ^0.20.3
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  app_settings: ^8.0.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: 3.2.5
  json_serializable: ^6.14.0
  drift_dev: ^2.34.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/content/seed_content.json

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
